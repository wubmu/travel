<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新加坡行程笔记</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --text: #c9d1d9;
    --muted: #8b949e;
    --accent: #58a6ff;
    --border: #30363d;
    --code-bg: #161b22;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.75;
  }
  .nav {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    background: #161b22;
  }
  .nav a {
    color: var(--accent);
    text-decoration: none;
    font-size: 0.9rem;
  }
  .nav a:hover { text-decoration: underline; }
  .content {
    max-width: 800px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
  }
  .content h1 { font-size: 2rem; color: #f0f6fc; margin: 1.5rem 0 1rem; }
  .content h2 { font-size: 1.4rem; color: #f0f6fc; margin: 1.5rem 0 0.75rem; padding-bottom: 0.3rem; border-bottom: 1px solid var(--border); }
  .content h3 { font-size: 1.1rem; color: #f0f6fc; margin: 1rem 0 0.5rem; }
  .content p { margin: 0.75rem 0; }
  .content blockquote {
    border-left: 3px solid var(--accent);
    padding: 0.5rem 1rem;
    margin: 1rem 0;
    color: var(--muted);
    background: #161b22;
    border-radius: 0 6px 6px 0;
  }
  .content ul, .content ol { padding-left: 1.5rem; margin: 0.5rem 0; }
  .content li { margin: 0.25rem 0; }
  .content code {
    background: var(--code-bg);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.9em;
    border: 1px solid var(--border);
  }
  .content pre {
    background: var(--code-bg);
    padding: 1rem;
    border-radius: 8px;
    overflow-x: auto;
    border: 1px solid var(--border);
    margin: 1rem 0;
  }
  .content pre code { border: none; padding: 0; }
  .content strong { color: #f0f6fc; }
  .content a { color: var(--accent); }
  .content table {
    width: 100%;
    border-collapse: collapse;
    margin: 1rem 0;
  }
  .content th, .content td {
    text-align: left;
    padding: 0.6rem 0.8rem;
    border: 1px solid var(--border);
  }
  .content th { background: #161b22; font-weight: 600; }
  .content hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
  .loading {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--muted);
  }
</style>
</head>
<body>
<nav class="nav">
  <a href="index.html">← 返回首页</a>
</nav>
<div class="content" id="content">
  <div class="loading">⏳ 加载中...</div>
</div>
<script>
async function render() {
  try {
    const res = await fetch('sg-2025-06-09.md');
    if (!res.ok) throw new Error('Failed to load');
    const md = await res.text();
    document.getElementById('content').innerHTML = marked.parse(md);
    document.title = document.querySelector('h1')?.textContent || '行程笔记';
  } catch (e) {
    document.getElementById('content').innerHTML = '<p>加载失败</p>';
  }
}
render();
</script>
</body>
</html>
